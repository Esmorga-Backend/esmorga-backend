name: Deploy to Prod
run-name: Deploying ${{ github.ref_name }} to PROD 🚀

on:
  push:
    branches:
    - release/*
  workflow_dispatch:

jobs:
  Deploy-To-PROD:
    uses: ./.github/workflows/Deploy.yml
    secrets: inherit
    permissions:
      contents: read
    with:
      environment: PROD
      image_and_tag: ghcr.io/${{ github.repository }}:${{ github.sha }}
