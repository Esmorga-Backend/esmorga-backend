name: 'Build and Push Docker Image'
description: 'Builds a Docker image and pushes it to GitHub Container Registry (GHCR)'

inputs:
  image_name:
    description: 'Name of the Docker image (e.g., my-org/my-app)'
    required: true
  image_tag:
    description: 'Tag for the Docker image (e.g., latest, v1.0.0)'
    required: false
    default: 'latest'
  github_token:
    description: 'GITHUB_TOKEN to authenticate with GHCR'
    required: true
  dockerfile_path:
    description: 'Path to the Dockerfile'
    required: false
    default: '.'

outputs:
  image_digest:
    description: 'Digest of the pushed Docker image'
    value: ${{ steps.build-push.outputs.digest }}

runs:
  using: 'composite'
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github_token }}

    - name: Build and push Docker image
      id: build-push
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.dockerfile_path }}
        push: true
        tags: ghcr.io/${{ inputs.image_name }}:${{ inputs.image_tag }}
        cache-from: type=gha
        cache-to: type=gha,mode=max